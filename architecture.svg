<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="ui-monospace,Menlo,monospace">
<rect width="900" height="620" fill="#F4F7F1"/>
<style>
.t{font:700 12px system-ui;fill:#171F1A}.s{font:9.5px ui-monospace,monospace;fill:#485349}
.h{font:700 11px system-ui;fill:#6E7A6E;letter-spacing:1.2px}
.b{fill:#FFFFFF;stroke:#C2CEBB;stroke-width:1}
.k{fill:#DDE7D8;stroke:#2C6144;stroke-width:1.5}
.g{fill:#F2E4E0;stroke:#9E3521;stroke-width:1.5}
.l{stroke:#6E7A6E;stroke-width:1.3;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6E7A6E" stroke-width="1.6"/></marker></defs>

<text class="t" x="24" y="30" font-size="17">ExceptionZero — Fortified Enterprise Fleet</text>
<text class="s" x="24" y="48">Gemini 3.5 Flash · Vertex AI · Google ADK · Cloud Run · Pub/Sub · Firestore · BigQuery · Model Armor · Cloud Trace</text>

<text class="h" x="24" y="80">CONTROL PLANE</text>
<rect class="k" x="20" y="90" width="200" height="52" rx="4"/><text class="t" x="32" y="110">Agent Registry</text><text class="s" x="32" y="126">Firestore — capability, version,</text><text class="s" x="32" y="137">tool scope, SA identity</text>
<rect class="k" x="20" y="150" width="200" height="52" rx="4"/><text class="t" x="32" y="170">Agent Gateway</text><text class="s" x="32" y="186">routing + policy; discovers</text><text class="s" x="32" y="197">agents, never hardcodes them</text>
<rect class="b" x="20" y="210" width="200" height="52" rx="4"/><text class="t" x="32" y="230">Memory Bank</text><text class="s" x="32" y="246">prior resolutions,</text><text class="s" x="32" y="257">deferred-case state</text>
<rect class="b" x="20" y="270" width="200" height="52" rx="4"/><text class="t" x="32" y="290">Observability</text><text class="s" x="32" y="306">OTel spans → Cloud Trace,</text><text class="s" x="32" y="317">one span per agent per case</text>
<rect class="g" x="20" y="330" width="200" height="52" rx="4"/><text class="t" x="32" y="350">Model Armor</text><text class="s" x="32" y="366">inline screening of all</text><text class="s" x="32" y="377">attacker-controlled text</text>

<path class="l" d="M220 176 L242 176" marker-end="url(#a)"/>
<path class="l" d="M220 356 L232 356 L232 112 L248 112" marker-end="url(#a)"/>

<text class="h" x="248" y="80">EXECUTION PATH — each agent runs under its own service account</text>
<rect class="b" x="244" y="90" width="636" height="40" rx="4"/><text class="t" x="256" y="108">Ingress · Pub/Sub → Cloud Run</text><text class="s" x="256" y="122">scales to zero · event-driven, not a loop over a list</text>
<path class="l" d="M562 130 L562 142" marker-end="url(#a)"/>

<rect class="b" x="244" y="144" width="636" height="38" rx="4"/><text class="t" x="256" y="162">1 · Triage</text><text class="s" x="360" y="162">classify only; memo is DATA, never instruction</text><text class="s" x="700" y="162">ez-triage@ · exceptions:read</text>
<path class="l" d="M562 182 L562 194" marker-end="url(#a)"/>

<rect class="b" x="244" y="196" width="636" height="38" rx="4"/><text class="t" x="256" y="214">2 · Context Coordinator</text><text class="s" x="430" y="214">dispatches specialists, assigns EV-ids</text><text class="s" x="700" y="214">ez-coord@ · bq:jobUser</text>
<path class="l" d="M562 234 L562 244" marker-end="url(#a)"/>

<rect class="b" x="244" y="246" width="153" height="38" rx="4"/><text class="s" x="256" y="263">Invoice</text><text class="s" x="256" y="276">ez-invoice@</text>
<rect class="b" x="405" y="246" width="153" height="38" rx="4"/><text class="s" x="417" y="263">Counterparty</text><text class="s" x="417" y="276">ez-customer@</text>
<rect class="b" x="566" y="246" width="153" height="38" rx="4"/><text class="s" x="578" y="263">History</text><text class="s" x="578" y="276">ez-history@</text>
<rect class="b" x="727" y="246" width="153" height="38" rx="4"/><text class="s" x="739" y="263">Precedent</text><text class="s" x="739" y="276">ez-precedent@</text>
<path class="l" d="M562 284 L562 296" marker-end="url(#a)"/>

<rect class="k" x="244" y="298" width="636" height="42" rx="4"/><text class="t" x="256" y="316">3 · Diagnosis — NO TOOLS</text><text class="s" x="256" y="332">reasons only over evidence handed to it; every claim cites an EV-id</text><text class="s" x="660" y="316">ez-diagnosis@ · NO data roles</text><text class="s" x="660" y="332">IAM denies BigQuery, not the prompt</text>
<path class="l" d="M562 340 L562 352" marker-end="url(#a)"/>

<rect class="k" x="244" y="354" width="636" height="42" rx="4"/><text class="t" x="256" y="372">4 · Risk Gate — deterministic code, not a model call</text><text class="s" x="256" y="388">confidence ≥ .85 · value ≤ 5k · compensating action exists · screening clean · counterparty history ≥ 3</text>
<path class="l" d="M562 396 L562 408" marker-end="url(#a)"/>

<rect class="b" x="244" y="410" width="200" height="32" rx="4" stroke="#2C6144" stroke-width="1.5"/><text class="s" x="256" y="430" fill="#2C6144">auto_resolve</text>
<rect class="b" x="452" y="410" width="212" height="32" rx="4" stroke="#7A5B12" stroke-width="1.5"/><text class="s" x="464" y="430" fill="#7A5B12">defer — awaiting evidence</text>
<rect class="b" x="672" y="410" width="208" height="32" rx="4" stroke="#9E3521" stroke-width="1.5"/><text class="s" x="684" y="430" fill="#9E3521">quarantine — security event</text>

<path class="l" d="M344 442 L344 454" marker-end="url(#a)"/>
<rect class="b" x="244" y="456" width="636" height="38" rx="4"/><text class="t" x="256" y="474">5 · Execution — the only write credential</text><text class="s" x="256" y="488">rollback record written BEFORE the act · idempotency key · no decision authority</text><text class="s" x="700" y="474">ez-exec@ · exceptions:write</text>
<path class="l" d="M562 494 L562 504" marker-end="url(#a)"/>

<rect class="b" x="244" y="506" width="636" height="38" rx="4"/><text class="t" x="256" y="524">6 · Verification</text><text class="s" x="380" y="524">confirm post-state or fire the compensating action</text><text class="s" x="700" y="524">ez-verify@ · read + rollback</text>

<rect class="g" x="244" y="556" width="636" height="38" rx="4"/><text class="t" x="256" y="574">Sweeper · Cloud Scheduler</text><text class="s" x="430" y="574">re-opens deferred cases when later evidence arrives — days to weeks</text>
<path class="l" d="M452 426 L236 426 L236 575 L240 575" marker-end="url(#a)"/>
<path class="l" d="M880 575 L890 575 L890 215 L884 215" marker-end="url(#a)"/>

<text class="s" x="24" y="612">Guardrails: Pydantic-validated handoffs · evidence-citation enforcement · 4-turn loop guard · idempotent execution · compensating rollback · circuit breaker (3 failures / 20 cases)</text>
</svg>
